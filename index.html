<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alles Gute, Sonja!</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1040, #5b2a86, #e0457b, #ff9a5a);
    background-size: 300% 300%;
    animation: bg 14s ease infinite;
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 16px;
  }
  @keyframes bg { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  h1 { font-size: clamp(2rem, 7vw, 4.5rem); letter-spacing: .02em; z-index: 2; }
  h1 .l { display: inline-block; opacity: 0; transform: translateY(40px) scale(.5);
          animation: pop .6s cubic-bezier(.2,1.6,.4,1) forwards; }
  h1 .name { color: #ffe066; text-shadow: 0 0 24px rgba(255,224,102,.7); }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .wave { animation: pop .6s cubic-bezier(.2,1.6,.4,1) forwards, bob 2.4s ease-in-out 1.5s infinite !important; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-3deg); } }

  p.sub { margin-top: 1rem; font-size: clamp(1rem, 2.6vw, 1.5rem); max-width: 34ch; z-index: 2;
          opacity: 0; animation: fade 1.2s ease 2.2s forwards; }
  @keyframes fade { to { opacity: 1; } }

  /* Torte */
  .cake { position: relative; width: 220px; height: 170px; margin-top: 2.2rem; z-index: 2;
          opacity: 0; transform: translateY(60px); animation: rise 1s ease 1.6s forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .tier { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 10px 10px 6px 6px; }
  .t1 { bottom: 0; width: 220px; height: 70px; background: #ff7aa8; }
  .t2 { bottom: 70px; width: 160px; height: 55px; background: #ffd1e0; }
  .tier::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 16px;
                  background: #fff; border-radius: 10px 10px 40% 40% / 10px 10px 100% 100%; }
  .candle { position: absolute; bottom: 125px; width: 8px; height: 34px; border-radius: 3px;
            background: repeating-linear-gradient(45deg, #5ec8ff 0 6px, #fff 6px 12px); }
  .flame { position: absolute; top: -20px; left: 50%; width: 12px; height: 18px; margin-left: -6px;
           background: radial-gradient(circle at 50% 70%, #fff6a8, #ffb400 60%, transparent 70%);
           border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
           animation: flicker .25s ease-in-out infinite alternate; filter: drop-shadow(0 0 8px #ffb400); }
  @keyframes flicker { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.12,.92) rotate(4deg); } }

  /* Ballons */
  .balloon { position: fixed; bottom: -140px; width: 60px; height: 76px; border-radius: 50% 50% 48% 48%;
             z-index: 1; animation: float linear infinite; opacity: .9; }
  .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 70px; background: rgba(255,255,255,.6); }
  @keyframes float {
    from { transform: translateY(0) translateX(0) rotate(-5deg); }
    50%  { transform: translateY(-60vh) translateX(30px) rotate(5deg); }
    to   { transform: translateY(-130vh) translateX(-20px) rotate(-5deg); }
  }

  button { margin-top: 1.6rem; z-index: 6; padding: .7rem 1.6rem; font-size: 1rem; border: 0; border-radius: 99px;
           background: #ffe066; color: #3a1a55; font-weight: 700; cursor: pointer; transition: transform .15s; }
  button:hover { transform: scale(1.08); }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <h1 id="title"></h1>
  <p class="sub">Wir wünschen dir einen fantastischen Tag voller Freude, Lachen und Kuchen. 🎂</p>

  <div class="cake">
    <div class="tier t1"></div>
    <div class="tier t2"></div>
    <div class="candle" style="left:78px"><div class="flame"></div></div>
    <div class="candle" style="left:106px"><div class="flame" style="animation-delay:.1s"></div></div>
    <div class="candle" style="left:134px"><div class="flame" style="animation-delay:.2s"></div></div>
  </div>

  <button id="boom">🎉 Konfetti!</button>

<script>
  // Titel Buchstabe für Buchstabe einblenden
  const title = document.getElementById('title');
  const build = (text, cls) => [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'l ' + cls;
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.animationDelay = (title.children.length * 0.06) + 's';
    title.appendChild(s);
  });
  build('Alles Gute, ', '');
  const nameStart = title.children.length;
  build('Sonja', 'name');
  build('!', '');
  // Name wippt nach dem Einblenden
  [...title.children].slice(nameStart, nameStart + 8).forEach((s, i) => {
    s.classList.add('wave');
    s.style.animationDelay = `${s.style.animationDelay}, ${1.5 + i * 0.1}s`;
  });

  // Ballons
  const colors = ['#ff5d8f', '#ffd166', '#06d6a0', '#4cc9f0', '#b388ff', '#ff8a4c'];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = Math.random() * 96 + 'vw';
    b.style.background = `radial-gradient(circle at 30% 30%, #fff8, ${colors[i % colors.length]} 60%)`;
    b.style.animationDuration = (9 + Math.random() * 8) + 's';
    b.style.animationDelay = (Math.random() * 8) + 's';
    document.body.appendChild(b);
  }

  // Konfetti
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, parts = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', resize); resize();

  function burst(x, y, n = 140) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
                   w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
                   r: Math.random() * 6, vr: (Math.random() - .5) * .4,
                   c: colors[Math.floor(Math.random() * colors.length)], life: 1 });
    }
  }
  function rain() {
    for (let i = 0; i < 3; i++)
      parts.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3,
                   w: 6 + Math.random() * 5, h: 4 + Math.random() * 4, r: Math.random() * 6,
                   vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)], life: 1 });
  }
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    if (Math.random() < .5) rain();
    parts = parts.filter(p => p.y < H + 20 && p.life > 0);
    for (const p of parts) {
      p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    requestAnimationFrame(loop);
  })();

  document.getElementById('boom').onclick = () => burst(W / 2, H / 2, 220);
  addEventListener('pointerdown', e => { if (e.target.id !== 'boom') burst(e.clientX, e.clientY, 80); });
  setTimeout(() => { burst(W * .25, H * .4); burst(W * .75, H * .4); }, 1200);
</script>
</body>
</html>
